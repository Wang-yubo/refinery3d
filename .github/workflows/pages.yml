name: Pages

# 发布源：Settings → Pages → Source =「GitHub Actions」
# 本工作流在 main 推送时自动组装 _site 并发布到 https://<user>.github.io/refinery3d/
# configure-pages 带 enablement: true，会在尚未启用时尝试用工作流令牌自动开启 Pages（需仓库管理员权限）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a --exclude node_modules --exclude diag --exclude .git \
                --exclude .github --exclude _site --exclude package.json \
                --exclude package-lock.json ./ _site/
          # 站点子路径 /refinery3d/：全部引用均为相对路径，无需改写
          test -f _site/index.html
          du -sh _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
