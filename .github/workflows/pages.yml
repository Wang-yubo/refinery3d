name: Pages

# 当前仓库 Pages 的发布源是「Deploy from a branch」（main 根目录），由 GitHub 自带的
# 「pages build and deployment」自动发布，本工作流不参与，避免重复部署产生失败记录。
# 若要切换为 Actions 部署：Settings → Pages → Source 选「GitHub Actions」，
# 并取消下面 push 触发器的注释，由本工作流接管发布。
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          rsync -a --exclude node_modules --exclude diag --exclude .git \
                --exclude .github --exclude _site --exclude package.json \
                --exclude package-lock.json ./ _site/
          # 站点子路径 /refinery3d/：全部引用均为相对路径，无需改写
          test -f _site/index.html
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
